name: Daily Douyin POI Crawler

on:
  schedule:
    # 每天 UTC 00:00 执行 (北京时间 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Search keyword'
        required: true
        default: '杭州 露营'
      limit:
        description: 'Number of POIs to collect'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install ego-browser
        run: npm install -g ego-browser || echo "ego-browser may already be installed"

      - name: Run Douyin POI Crawler
        run: |
          cd crawler
          KEYWORD="${{ github.event.inputs.keyword || '杭州 露营' }}"
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "🕷️ Starting crawler with keyword: $KEYWORD (limit: $LIMIT)"
          node crawl.mjs -k "$KEYWORD" -n "$LIMIT" -o /tmp/douyin_results.geojson
          echo "✅ Crawler finished"

      - name: Process and Merge Data
        run: |
          cd crawler
          node process_and_merge.mjs /tmp/douyin_results.geojson

      - name: Verify Data Files
        run: |
          echo "📊 City data summary:"
          if [ -f public/data/cities/cities.json ]; then
            cat public/data/cities/cities.json
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Commit Data Changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 检查是否有数据变化
          if [ -n "$(git status --porcelain public/data/)" ]; then
            git add public/data/cities/*.geojson public/data/cities/cities.json 2>/dev/null || true
            git commit -m "chore: auto-update POI data from Douyin crawler

- Crawled data at $(date -u +'%Y-%m-%d %H:%M:%S UTC')
- Keyword: ${{ github.event.inputs.keyword || '杭州 露营' }}
- Merged with existing data and deployed

Co-authored-by: Douyin Crawler <action@github.com>"
            git push origin main
          else
            echo "No data changes detected"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: crawler-logs
          path: /tmp/douyin_results.geojson
          retention-days: 7
