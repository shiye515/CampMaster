name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        # ✨ Feature Request
        
        Have a great idea? We'd love to hear it! Please describe the feature you'd like to see.

  - type: textarea
    id: description
    attributes:
      label: "Feature Description (功能描述)"
      description: "Clearly describe the feature or improvement you'd like"
      placeholder: "Describe your feature idea here..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Motivation (动机)"
      description: "Why is this feature needed? What problem does it solve?"
      placeholder: "Explain the motivation behind this feature request..."
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "Use Case (使用场景)"
      description: "How would you use this feature? What's the user journey?"
      placeholder: "Describe how you would use this feature..."

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered (其他方案)"
      description: "Are there alternative solutions or workarounds?"
      placeholder: "Describe any alternative approaches you've considered..."

  - type: dropdown
    id: priority
    attributes:
      label: "Priority (优先级)"
      description: "How important is this feature?"
      options:
        - "Low - Nice to have"
        - "Medium - Would improve the experience"
        - "High - Would significantly improve the experience"
        - "Critical - Blocks important workflows"
      default: 0

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context (其他信息)"
      description: "Add screenshots, mockups, or any additional context"
