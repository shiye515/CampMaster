name: Add New POI
description: Submit a new camping site or point of interest
title: Add POI
labels: ["data", "poi"]
body:
  - type: markdown
    attributes:
      value: "# Add New POI"
  - type: textinput
    id: name
    attributes:
      label: Name
      placeholder: Spring Grassland Camp
    validations:
      required: true
  - type: textinput
    id: city
    attributes:
      label: City
      placeholder: Hangzhou
    validations:
      required: true
  - type: textinput
    id: cost
    attributes:
      label: Cost
      placeholder: "0"
    validations:
      required: true
  - type: textarea
    id: booking
    attributes:
      label: Booking Method
      placeholder: How to book
    validations:
      required: true
  - type: textinput
    id: longitude
    attributes:
      label: Longitude
      placeholder: "120.1551"
    validations:
      required: true
  - type: textinput
    id: latitude
    attributes:
      label: Latitude
      placeholder: "30.2741"
    validations:
      required: true
