name: Add New POI
description: Submit a new camping site or point of interest to CampMaster
labels: ["data", "poi-submission"]
body:
  - type: markdown
    attributes:
      value: |
        # Add New POI / 添加新的兴趣点
        
        Thank you for contributing to CampMaster!

  - type: textinput
    id: poi_name
    attributes:
      label: "POI Name / 兴趣点名称"
      description: "E.g., Spring Grassland Camp"
      placeholder: "春晓苕溪大草坪营地"
    validations:
      required: true

  - type: textinput
    id: city
    attributes:
      label: "City / 城市"
      description: "E.g., Hangzhou"
      placeholder: "杭州市"
    validations:
      required: true

  - type: textinput
    id: cost
    attributes:
      label: "Cost per Person (Yuan) / 人均费用"
      description: "0 means free"
      placeholder: "100"
    validations:
      required: true

  - type: textinput
    id: longitude
    attributes:
      label: "Longitude / 经度"
      description: "E.g., 120.1551"
      placeholder: "120.1551"
    validations:
      required: true

  - type: textinput
    id: latitude
    attributes:
      label: "Latitude / 纬度"
      description: "E.g., 30.2741"
      placeholder: "30.2741"
    validations:
      required: true

  - type: textarea
    id: booking
    attributes:
      label: "Booking Method / 预约方式"
      description: "How to book or visit"
      placeholder: "How to book or visit"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Additional Info / 其他信息"
      description: "Add any other context"
