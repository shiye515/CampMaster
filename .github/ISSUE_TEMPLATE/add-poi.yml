name: Add New POI
description: Submit a new camping site or point of interest to CampMaster
title: Add POI
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        # Add New POI / 添加新兴趣点
        Thank you for contributing to CampMaster!

  - type: textinput
    id: name
    attributes:
      label: POI Name / 兴趣点名称
      placeholder: "E.g., Spring Grassland Camp"
    validations:
      required: true

  - type: textinput
    id: city
    attributes:
      label: City / 城市
      placeholder: "E.g., Hangzhou"
    validations:
      required: true

  - type: textinput
    id: cost
    attributes:
      label: Cost (Yuan) / 人均费用
      placeholder: "0, 100, 300"
    validations:
      required: true

  - type: textinput
    id: longitude
    attributes:
      label: Longitude / 经度
      placeholder: "120.1551"
    validations:
      required: true

  - type: textinput
    id: latitude
    attributes:
      label: Latitude / 纬度
      placeholder: "30.2741"
    validations:
      required: true

  - type: textarea
    id: booking
    attributes:
      label: Booking Method / 预约方式
      placeholder: "How to book or visit"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes (Optional) / 备注
      placeholder: "Any additional information"
