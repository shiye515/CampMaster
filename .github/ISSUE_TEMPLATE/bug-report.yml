name: Bug Report
description: Report a bug or issue with the application
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # 🐛 Bug Report
        
        Thank you for reporting a bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: "Description (问题描述)"
      description: "Clearly describe the bug you encountered"
      placeholder: "Describe the issue here..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce (复现步骤)"
      description: "Steps to reproduce the issue"
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. See the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior (期望行为)"
      description: "What should happen instead"
      placeholder: "Expected behavior..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior (实际行为)"
      description: "What actually happened"
      placeholder: "Actual behavior..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment (环境信息)"
      description: "Browser, OS, screen size, etc."
      placeholder: |
        - Browser: Chrome/Firefox/Safari
        - OS: Windows/macOS/Linux
        - Screen: Desktop/Mobile
        - Network: Desktop/Mobile connection

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context (其他信息)"
      description: "Add any other context, screenshots, or logs"
